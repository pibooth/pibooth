# Dependabot configuration: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Without this file Dependabot only reacts to security alerts. With it, it also
# opens a pull request when an action used by the workflows or a Python
# dependency has a newer version. Monthly, to keep the noise low.

version: 2
updates:

  # Actions used by .github/workflows/*.yml, on the default branch...
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # One pull request for all the actions rather than one per action
      github-actions:
        patterns: ["*"]

  # ...and on the 3.x development branch, which has its own workflow
  - package-ecosystem: github-actions
    directory: /
    target-branch: "3.x"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  # Python dependencies: setup.py (install_requires) and docs/requirements.txt.
  # Most of them are declared as ranges, so a pull request is only opened when
  # a new release falls outside the range.
  - package-ecosystem: pip
    directories:
      - /
      - /docs
    schedule:
      interval: monthly
