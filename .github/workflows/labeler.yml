name: Pull Request Labeler

# 'pull_request_target' gives the token the write access needed to label a
# pull request opened from a fork. Nothing from the pull request is checked
# out nor run here.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write  # to create the labels that do not exist yet

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/labeler@v6
