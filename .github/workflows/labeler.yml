# Apply labels to pull requests from the files they change, as configured in
# .github/labeler.yml. The labels that do not exist yet are created by the
# action (that is what the 'issues: write' permission is for).
#
# 'pull_request_target' rather than 'pull_request' so that the token has the
# write access needed to label a pull request opened from a fork. The
# workflow does not check out nor run anything from the pull request, so
# the elevated context is safe.

name: Pull Request Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/labeler@v6
